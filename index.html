<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Jules Arrière-Plan V5</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<video id="camera" autoplay playsinline muted></video><canvas id="output"></canvas>
<header><b>Jules Arrière-Plan</b><button id="switch">↻</button></header><div id="status">Prêt</div>
<section id="start"><div>📷</div><h1>Caméra</h1><p>La caméra reste visible même si le détourage n'est pas disponible.</p><button id="startBtn">Ouvrir la caméra</button></section>
<nav><button id="bg">🎨<small>Décors</small></button><button id="photo">●</button><button id="video">🎥<small>Vidéo</small></button><button id="gal">🖼️<small>Galerie</small></button></nav>
<section id="decor" class="sheet hide"><div class="head"><b>Choisir un décor</b><button id="closeD">✕</button></div><div id="tabs"></div><div id="bgs"></div><label>📱 Choisir une image du téléphone<input id="custom" type="file" accept="image/*"></label></section>
<section id="gallery" class="sheet hide"><div class="head"><b>Galerie</b><button id="closeG">✕</button></div><div id="items"></div><button id="clear">Effacer la galerie</button></section><div id="toast"></div>
</main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script><script src="app.js"></script></body></html>
